<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    
    <title>Katanx - Sign In</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Neue Montreal / Gotham Book alternative: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: var(--spacing-lg);
        }
        
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-logo {
            font-size: var(--font-size-xl);
            font-weight: 400; /* Regular/Book weight */
            color: var(--theme-neon);
            letter-spacing: 3px; /* +2 to +4 range, using 3px */
            margin-bottom: var(--spacing-sm);
            /* text-transform: uppercase; */ /* Removed - using lowercase */
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Minimalist slash replacing the X for auth logo */
        .auth-logo .x-slash {
            position: relative;
            display: inline-block;
            color: transparent; /* Hide the X character */
            width: 0.6em; /* Match approximate width of a character */
        }
        
        .auth-logo .x-slash::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.5px;
            height: 70%;
            background: var(--theme-neon);
            transform: translate(-50%, -50%) rotate(45deg);
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
        }
        
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .auth-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            border-bottom: var(--border-width-thin) solid var(--border-color);
        }
        
        .auth-tab {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: var(--transition-fast);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        
        .auth-tab:hover {
            color: var(--text-primary);
        }
        
        .auth-tab.active {
            color: var(--theme-neon);
            border-bottom-color: var(--theme-neon);
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: var(--spacing-md);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            font-size: var(--font-size-sm);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-tertiary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            font-family: inherit;
            transition: var(--transition-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--theme-neon);
            background: var(--bg-secondary);
        }
        
        .form-input::placeholder {
            color: var(--text-tertiary);
        }
        
        .phone-input-group {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .phone-country {
            flex: 0 0 80px;
        }
        
        .phone-number {
            flex: 1;
        }
        
        .verification-code-group {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .verification-input {
            flex: 1;
        }
        
        .send-code-btn {
            flex: 0 0 auto;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-tertiary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
        }
        
        .send-code-btn:hover:not(:disabled) {
            background: var(--bg-secondary);
            border-color: var(--theme-neon);
        }
        
        .send-code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: var(--bg-tertiary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
        }
        
        .social-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--theme-neon);
        }
        
        .social-btn svg {
            width: 20px;
            height: 20px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            color: var(--text-tertiary);
            font-size: var(--font-size-sm);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        
        .divider span {
            padding: 0 var(--spacing-md);
        }
        
        .submit-btn {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--theme-neon);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--border-radius-md);
            font-size: var(--font-size-base);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            margin-top: var(--spacing-md);
        }
        
        .submit-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error-message {
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: var(--border-radius-md);
            color: #ff4444;
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-md);
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: var(--border-radius-md);
            color: #00ff00;
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-md);
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: var(--spacing-md);
        }
        
        .forgot-password a {
            color: var(--theme-neon);
            text-decoration: none;
            font-size: var(--font-size-sm);
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-tertiary);
            border-top-color: var(--theme-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: var(--spacing-xs);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">katanx</div>
                <div class="auth-subtitle">Sign in to continue</div>
                <div id="mockModeIndicator" style="display: none; margin-top: 12px; padding: 8px; background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); border-radius: 4px; font-size: 11px; color: #ffc107;">
                    🧪 Mock Testing Mode - No external services required
                </div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Social Login Buttons -->
            <div class="social-buttons" id="socialButtons">
                <a href="/api/auth/google" class="social-btn" id="googleBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </a>
                <a href="/api/auth/twitter" class="social-btn" id="twitterBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Continue with X (Twitter)
                </a>
                <a href="/api/auth/github" class="social-btn" id="githubBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Continue with GitHub
                </a>
                <a href="/api/auth/apple" class="social-btn" id="appleBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Continue with Apple
                </a>
            </div>
            
            <div class="divider">
                <span>or</span>
            </div>
            
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="phone">Phone</button>
                <button class="auth-tab" data-tab="email">Email</button>
            </div>
            
            <!-- Phone Auth Form -->
            <form class="auth-form active" id="phoneForm">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div class="phone-input-group">
                        <select class="form-input phone-country" id="countryCode">
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+81">🇯🇵 +81</option>
                            <option value="+86">🇨🇳 +86</option>
                            <option value="+91">🇮🇳 +91</option>
                        </select>
                        <input type="tel" class="form-input phone-number" id="phoneNumber" placeholder="(555) 123-4567" required>
                    </div>
                </div>
                
                <div class="form-group" id="verificationGroup" style="display: none;">
                    <label class="form-label">Verification Code</label>
                    <div class="verification-code-group">
                        <input type="text" class="form-input verification-input" id="verificationCode" placeholder="000000" maxlength="6" pattern="[0-9]{6}">
                        <button type="button" class="send-code-btn" id="resendCodeBtn">Resend</button>
                    </div>
                </div>
                
                <button type="button" class="submit-btn" id="sendCodeBtn">Send Verification Code</button>
                <button type="submit" class="submit-btn" id="verifyCodeBtn" style="display: none;">Verify & Sign In</button>
            </form>
            
            <!-- Email Auth Form -->
            <form class="auth-form" id="emailForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="passwordInput" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="submit-btn" id="emailSubmitBtn">Sign In</button>
                
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
