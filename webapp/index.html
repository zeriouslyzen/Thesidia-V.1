<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Thesidia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Thesidia</span>
                </div>
                <div class="status-indicators">
                    <div class="status-indicator" id="ollamaStatus" title="Ollama Status">
                        <span class="status-dot"></span>
                        <span class="status-label">Ollama</span>
                    </div>
                    <div class="status-indicator" id="thesidiaStatus" title="Thesidia Status">
                        <span class="status-dot"></span>
                        <span class="status-label">Thesidia</span>
                    </div>
                </div>
                <button class="menu-btn" id="menuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Main Chat Container -->
        <main class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <!-- No welcome message - let Thesidia introduce herself naturally -->
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- Thinking Steps Display -->
            <div class="thinking-steps" id="thinkingSteps" style="display: none;">
                <div class="thinking-header">
                    <span>Thinking Steps</span>
                    <button class="toggle-thinking" id="toggleThinking">Hide</button>
                </div>
                <div class="thinking-content" id="thinkingContent"></div>
            </div>
        </main>

        <!-- Advanced Prompt Bar -->
        <div class="prompt-bar-container">
            <div class="prompt-bar-wrapper">
                <div class="prompt-bar" id="promptBar">
                    <div class="prompt-input-container">
                        <textarea 
                            id="promptInput" 
                            class="prompt-input" 
                            placeholder="Execute directive..."
                            rows="1"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                        ></textarea>
                        <div class="prompt-actions">
                            <button class="action-btn thinking-btn" id="thinkingBtn" aria-label="Show Thinking" title="Show thinking steps">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </button>
                            <button class="action-btn attach-btn" id="attachBtn" aria-label="Attach">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                </svg>
                            </button>
                            <button class="action-btn send-btn" id="sendBtn" aria-label="Send">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="feature-controls">
                        <label class="feature-toggle">
                            <input type="checkbox" id="showThinkingToggle">
                            <span>Show Thinking</span>
                        </label>
                        <label class="feature-toggle">
                            <input type="checkbox" id="deepResearchToggle">
                            <span>Deep Research</span>
                        </label>
                        <label class="feature-toggle">
                            <input type="checkbox" id="autoDetectToggle" checked>
                            <span>Auto-Detect</span>
                        </label>
                    </div>
                    <div class="prompt-suggestions" id="promptSuggestions"></div>
                </div>
            </div>
        </div>

        <!-- Sidebar Menu -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h2>Conversations</h2>
                    <button class="close-btn" id="closeSidebar" aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-actions">
                    <button class="sidebar-action-btn" id="newChatBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Conversation</span>
                    </button>
                </div>
                <div class="conversations-list" id="conversationsList">
                    <!-- Conversations will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
