<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Katanx // Application Layer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .application-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--spacing-lg) var(--spacing-md);
            scroll-behavior: smooth;
        }
        
        .application-content {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .application-header {
            margin-bottom: var(--spacing-xl);
        }
        
        .application-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .application-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .application-section {
            background: var(--bg-secondary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .application-section-title {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            border-bottom: var(--border-width-thin) solid var(--border-color);
            padding-bottom: var(--spacing-sm);
        }
        
        .insight-item {
            background: var(--bg-tertiary);
            border: var(--border-width-thin) solid var(--border-color);
            border-left: var(--border-width-thick) solid var(--accent-active);
            border-radius: var(--border-radius-sm);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        
        .insight-title {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .insight-content {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            line-height: var(--line-height-normal);
            margin-bottom: var(--spacing-sm);
        }
        
        .insight-action {
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
        }
        
        .action-item {
            display: flex;
            align-items: start;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-tertiary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-sm);
            margin-bottom: var(--spacing-sm);
        }
        
        .action-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }
        
        .action-content {
            flex: 1;
        }
        
        .action-title {
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .action-description {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }
        
        .action-item.completed .action-title {
            text-decoration: line-through;
            opacity: 0.6;
        }
        
        .application-empty {
            text-align: center;
            padding: var(--spacing-xxl);
            color: var(--text-secondary);
        }
        
        .application-loading {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>KATANX</span>
                </div>
                <div class="status-indicators">
                    <div class="status-indicator" id="applicationStatus" title="Application Status">
                        <span class="status-dot online" id="applicationStatusDot"></span>
                        <span class="status-label">Application</span>
                    </div>
                </div>
                <nav class="global-nav" id="globalNav">
                    <a href="/" class="nav-item" data-page="contexts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span>Contexts</span>
                    </a>
                    <a href="/stream.html" class="nav-item" data-page="stream">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        <span>Signal Stream</span>
                    </a>
                    <a href="/atlas.html" class="nav-item" data-page="atlas">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Pattern Atlas</span>
                    </a>
                    <a href="/reactor.html" class="nav-item" data-page="reactor">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                        <span>Research Reactor</span>
                    </a>
                    <a href="/application.html" class="nav-item active" data-page="application">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                        </svg>
                        <span>Application Layer</span>
                    </a>
                    <a href="/archive.html" class="nav-item" data-page="archive">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>
                        </svg>
                        <span>Archive</span>
                    </a>
                    <a href="/metrics_dashboard.html" class="nav-item" data-page="metrics">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        <span>System Metrics</span>
                    </a>
                </nav>
                <button class="menu-btn" id="menuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="application-container">
            <div class="application-content">
                <div class="application-header">
                    <h1 class="application-title">Application Layer</h1>
                    <p class="application-subtitle">Practical implementation of pattern intelligence to real-world application</p>
                </div>
                
                <div class="application-section">
                    <div class="application-section-title">Actionable Insights</div>
                    <div id="insightsList">
                        <div class="application-loading">Loading insights...</div>
                    </div>
                </div>
                
                <div class="application-section">
                    <div class="application-section-title">Action Items</div>
                    <div id="actionsList">
                        <div class="application-loading">Loading actions...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="state.js"></script>
    <script src="components.js"></script>
    <script src="router.js"></script>
    <script src="nav.js"></script>
    <script>
        async function loadInsights() {
            const container = document.getElementById('insightsList');
            if (!container) return;
            
            container.innerHTML = '';
            container.appendChild(Components.createLoadingIndicator('Loading insights...'));
            
            try {
                // Check cache
                const cached = window.State?.getCachedData('application');
                if (cached && cached.insights) {
                    displayInsights(cached.insights);
                    return;
                }
                
                const response = await fetch('/api/application/insights');
                if (!response.ok) throw new Error('Failed to load insights');
                
                const data = await response.json();
                
                // Cache
                if (window.State) {
                    window.State.cacheData('application', data, 300000);
                }
                
                displayInsights(data.insights || []);
            } catch (error) {
                console.error('Error loading insights:', error);
                container.innerHTML = '';
                container.appendChild(Components.createErrorState('Failed to load insights', loadInsights));
            }
        }
        
        function displayInsights(insights) {
            const container = document.getElementById('insightsList');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (insights.length === 0) {
                container.appendChild(Components.createEmptyState('No insights available. Insights will appear as patterns are applied.'));
                return;
            }
            
            insights.forEach(insight => {
                const card = Components.createInsightCard(insight);
                container.appendChild(card);
            });
        }
        
        async function loadActions() {
            try {
                const response = await fetch('/api/application/tracking');
                const data = await response.json();
                
                const actions = data.actions || [];
                displayActions(actions);
            } catch (error) {
                console.error('Error loading actions:', error);
                document.getElementById('actionsList').innerHTML = '<div class="application-empty">Error loading actions</div>';
            }
        }
        
        function displayActions(actions) {
            const container = document.getElementById('actionsList');
            
            if (actions.length === 0) {
                container.innerHTML = '<div class="application-empty">No action items. Actions will appear as insights are generated.</div>';
                return;
            }
            
            container.innerHTML = actions.map(action => `
                <div class="action-item ${action.completed ? 'completed' : ''}">
                    <input type="checkbox" class="action-checkbox" ${action.completed ? 'checked' : ''} 
                           onchange="toggleAction('${action.id}')">
                    <div class="action-content">
                        <div class="action-title">${escapeHtml(action.title || 'Action')}</div>
                        <div class="action-description">${escapeHtml(action.description || '')}</div>
                    </div>
                </div>
            `).join('');
        }
        
        async function toggleAction(actionId) {
            try {
                await fetch('/api/application/tracking', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action_id: actionId, completed: true })
                });
                
                loadActions();
            } catch (error) {
                console.error('Error toggling action:', error);
            }
        }
        
        window.toggleAction = toggleAction;
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load on page load
        loadInsights();
        loadActions();
        
        // Refresh every 30 seconds
        setInterval(() => {
            loadInsights();
            loadActions();
        }, 30000);
        
        document.getElementById('applicationStatusDot').classList.add('ready');
    </script>
    <script src="nav.js"></script>
</body>
</html>
