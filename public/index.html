<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    
    <!-- Primary Meta Tags -->
    <title>Katanx - AI Deep Research & Forensic Analysis Platform</title>
    <meta name="title" content="Katanx - AI Deep Research & Forensic Analysis Platform">
    <meta name="description" content="Katanx is an AI-powered deep research and forensic analysis platform. Uncover hidden patterns, decode symbols, explore the cosmos, and conduct advanced research with cutting-edge AI intelligence. Created by Jack Danger.">
    <meta name="keywords" content="AI research, forensic analysis, pattern recognition, deep learning, AI assistant, research platform, Jack Danger, katanx, AI intelligence, knowledge base, research tools">
    <meta name="author" content="Jack Danger">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.katanx.com/">
    
    <!-- Cross-Domain Connections -->
    <link rel="author" href="https://www.jackdanger.dev">
    <link rel="me" href="https://www.jackdanger.dev">
    <link rel="me" href="https://www.spiritlink.space">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.katanx.com/">
    <meta property="og:title" content="Katanx - AI Deep Research & Forensic Analysis Platform">
    <meta property="og:description" content="AI-powered deep research and forensic analysis. Uncover hidden patterns, decode symbols, and explore the cosmos with advanced AI intelligence. Created by Jack Danger.">
    <meta property="og:image" content="https://www.katanx.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Katanx">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.katanx.com/">
    <meta name="twitter:title" content="Katanx - AI Deep Research & Forensic Analysis">
    <meta name="twitter:description" content="AI-powered deep research and forensic analysis platform. Created by Jack Danger.">
    <meta name="twitter:image" content="https://www.katanx.com/twitter-image.jpg">
    <meta name="twitter:creator" content="@jackdanger">
    <meta name="twitter:site" content="@katanx">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Katanx",
      "alternateName": "KATANX",
      "url": "https://www.katanx.com",
      "description": "AI-powered deep research and forensic analysis platform. Uncover hidden patterns, decode symbols, and explore the cosmos with advanced AI intelligence.",
      "applicationCategory": "ResearchApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Person",
        "name": "Jack Danger",
        "url": "https://www.jackdanger.dev",
        "sameAs": [
          "https://www.jackdanger.dev",
          "https://www.spiritlink.space"
        ]
      },
      "publisher": {
        "@type": "Person",
        "name": "Jack Danger",
        "url": "https://www.jackdanger.dev"
      },
      "keywords": "AI research, forensic analysis, pattern recognition, deep learning, AI assistant",
      "inLanguage": "en-US",
      "isAccessibleForFree": true,
      "featureList": [
        "Deep Research Engine",
        "Forensic Analysis",
        "Pattern Recognition",
        "Web Search Integration",
        "Knowledge Base",
        "AI-Powered Synthesis"
      ]
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Katanx",
      "url": "https://www.katanx.com",
      "logo": "https://www.katanx.com/logo.png",
      "founder": {
        "@type": "Person",
        "name": "Jack Danger",
        "url": "https://www.jackdanger.dev"
      },
      "sameAs": [
        "https://www.jackdanger.dev",
        "https://www.spiritlink.space"
      ]
    }
    </script>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Note: For actual Neue Montreal or Gotham Book, add @font-face declarations if you have licenses -->
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <!-- Katanx Branding - Left (replaced profile) -->
                <div class="header-branding">
                    <span class="thesidia-text">katanx</span>
                </div>
                
                <!-- Menu Orb - Right -->
                <button class="menu-orb" id="menuBtn" aria-label="Menu">
                    <div class="orb-glow"></div>
                </button>
            </div>
            
            <!-- Sub Menu -->
            <div class="header-submenu">
                <!-- User Status Indicator - Far Left -->
                <div class="user-status-indicator" id="userStatusIndicator">
                    <span class="user-name-text" id="userNameText">Katanx Explore</span>
                    <span class="status-orb status-online" id="statusOrb" title="Status: Online"></span>
                </div>
                
                <!-- Status Selector Dropdown -->
                <div class="status-selector-dropdown" id="statusSelectorDropdown">
                    <div class="status-option" data-status="online">
                        <span class="status-orb status-online"></span>
                        <span>Online</span>
                    </div>
                    <div class="status-option" data-status="offline">
                        <span class="status-orb status-offline"></span>
                        <span>Offline</span>
                    </div>
                    <div class="status-option" data-status="away">
                        <span class="status-orb status-away"></span>
                        <span>Away</span>
                    </div>
                    <div class="status-option" data-status="focused">
                        <span class="status-orb status-focused"></span>
                        <span>Focused</span>
                    </div>
                </div>
                
                <nav class="advanced-nav">
                    <button class="nav-item" data-section="home">home</button>
                    <button class="nav-item" data-section="stream">stream</button>
                    <button class="nav-item" data-section="kx-cuts">kx cuts</button>
                    <button class="nav-item" data-section="circles">circles</button>
                    <button class="nav-item" data-section="studio">studio</button>
                </nav>
                
                <!-- Star Notepad Button - Far Right -->
                <button class="star-notepad-btn" id="starNotepadBtn" aria-label="Notes">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </button>
            </div>
            
            <!-- Star Notepad Panel -->
            <div class="notepad-panel" id="starNotepadPanel">
                <div class="notepad-header">
                    <h3>Notes</h3>
                    <button class="notepad-close" id="notepadClose" aria-label="Close">×</button>
                </div>
                <textarea class="notepad-textarea" id="notepadTextarea" placeholder="Your notes here... They persist across pages."></textarea>
            </div>
        </header>

        <!-- Main Chat Container -->
        <main class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </main>

        <!-- Modern Prompt Bar - Clean Design -->
        <div class="prompt-bar-container">
            <div class="prompt-bar-wrapper">
                <!-- Advanced Options (Collapsible) -->
                <div class="advanced-options" id="advancedOptions" style="display: none;">
                    <div class="options-content">
                        <div class="option-group">
                            <label>Format</label>
                            <div class="format-toggle">
                                <button class="format-option active" data-format="natural" id="formatNatural">
                                    <span>Natural</span>
                                </button>
                                <button class="format-option" data-format="structured" id="formatStructured">
                                    <span>Structured</span>
                                </button>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>Research Depth</label>
                            <div class="depth-control">
                                <input type="range" id="researchDepth" min="1" max="3" value="2" step="1" class="depth-slider">
                                <div class="depth-labels">
                                    <span data-depth="1">Quick</span>
                                    <span data-depth="2" class="active">Deep</span>
                                    <span data-depth="3">Forensic</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Prompt Input -->
                <div class="prompt-input-wrapper">
                    <div class="prompt-input-container" id="promptContainer">
                        <!-- File Upload Button -->
                        <input type="file" id="fileInput" multiple accept="*/*" style="display: none;">
                        <button class="attach-btn" id="attachBtn" aria-label="Attach file" title="Attach file">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        
                        <!-- Text Input -->
                        <textarea 
                            id="promptInput" 
                            class="prompt-input" 
                            placeholder="Message Thesidia..."
                            rows="1"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                        ></textarea>
                        
                        <!-- Attached Files Indicator -->
                        <div class="attached-files" id="attachedFiles" style="display: none;"></div>
                        
                        <!-- Send Button -->
                        <button class="send-btn" id="sendBtn" aria-label="Send" title="Send message (Enter)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Advanced Options Toggle -->
                    <button class="advanced-toggle" id="advancedToggle" aria-label="Advanced options">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar Menu -->
        <div class="left-sidebar" id="leftSidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h2>Conversations</h2>
                    <button class="close-btn" id="closeSidebar" aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-actions">
                    <button class="sidebar-action-btn" id="newChatBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Conversation</span>
                    </button>
                </div>
                <div class="conversations-list" id="conversationsList">
                    <!-- Conversations will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
