<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Katanx // Pattern Atlas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .atlas-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--spacing-lg) var(--spacing-md);
            scroll-behavior: smooth;
        }
        
        .atlas-content {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .atlas-header {
            margin-bottom: var(--spacing-xl);
        }
        
        .atlas-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }
        
        .atlas-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .atlas-view-toggle {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-lg);
            background: var(--bg-secondary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-xs);
        }
        
        .view-toggle-btn {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-md);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .view-toggle-btn:hover {
            color: var(--text-primary);
        }
        
        .view-toggle-btn.active {
            background: var(--accent-active);
            color: var(--bg-primary);
        }
        
        .atlas-graph-view {
            display: none;
            background: var(--bg-secondary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            min-height: 600px;
            margin-bottom: var(--spacing-lg);
        }
        
        .atlas-graph-view.active {
            display: block;
        }
        
        .atlas-graph-placeholder {
            text-align: center;
            padding: var(--spacing-xxl);
            color: var(--text-secondary);
        }
        
        .atlas-list-view {
            display: none;
        }
        
        .atlas-list-view.active {
            display: block;
        }
        
        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-md);
        }
        
        .pattern-card {
            background: var(--bg-secondary);
            border: var(--border-width-thin) solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .pattern-card:hover {
            border-color: var(--text-secondary);
        }
        
        .pattern-card-title {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }
        
        .pattern-card-description {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            line-height: var(--line-height-normal);
            margin-bottom: var(--spacing-md);
        }
        
        .pattern-card-meta {
            display: flex;
            justify-content: space-between;
            font-size: var(--font-size-xs);
            color: var(--text-tertiary);
        }
        
        .pattern-card-connections {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: var(--border-width-thin) solid var(--border-color);
        }
        
        .connection-count {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
        }
        
        .atlas-empty {
            text-align: center;
            padding: var(--spacing-xxl);
            color: var(--text-secondary);
        }
        
        .atlas-loading {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>KATANX</span>
                </div>
                <div class="status-indicators">
                    <div class="status-indicator" id="atlasStatus" title="Atlas Status">
                        <span class="status-dot online" id="atlasStatusDot"></span>
                        <span class="status-label">Atlas</span>
                    </div>
                </div>
                <nav class="global-nav" id="globalNav">
                    <a href="/" class="nav-item" data-page="contexts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span>Contexts</span>
                    </a>
                    <a href="/stream.html" class="nav-item" data-page="stream">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        <span>Signal Stream</span>
                    </a>
                    <a href="/atlas.html" class="nav-item active" data-page="atlas">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Pattern Atlas</span>
                    </a>
                    <a href="/reactor.html" class="nav-item" data-page="reactor">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                        <span>Research Reactor</span>
                    </a>
                    <a href="/application.html" class="nav-item" data-page="application">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                        </svg>
                        <span>Application Layer</span>
                    </a>
                    <a href="/archive.html" class="nav-item" data-page="archive">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>
                        </svg>
                        <span>Archive</span>
                    </a>
                    <a href="/metrics_dashboard.html" class="nav-item" data-page="metrics">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        <span>System Metrics</span>
                    </a>
                </nav>
                <button class="menu-btn" id="menuBtn" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="atlas-container">
            <div class="atlas-content">
                <div class="atlas-header">
                    <h1 class="atlas-title">Pattern Atlas</h1>
                    <p class="atlas-subtitle">Interactive mapping of pattern relationships and connections</p>
                </div>
                
                <div class="atlas-view-toggle">
                    <button class="view-toggle-btn active" data-view="graph" id="graphViewBtn">Graph</button>
                    <button class="view-toggle-btn" data-view="list" id="listViewBtn">List</button>
                </div>
                
                <div class="atlas-graph-view active" id="graphView">
                    <div class="atlas-graph-placeholder">
                        Graph visualization will be implemented with D3.js or vis.js
                    </div>
                </div>
                
                <div class="atlas-list-view" id="listView">
                    <div class="pattern-grid" id="patternGrid">
                        <div class="atlas-loading">Loading patterns...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        let patterns = [];
        let currentView = 'graph';
        
        function switchView(view) {
            currentView = view;
            
            document.getElementById('graphView').classList.toggle('active', view === 'graph');
            document.getElementById('listView').classList.toggle('active', view === 'list');
            
            document.getElementById('graphViewBtn').classList.toggle('active', view === 'graph');
            document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
        }
        
        document.getElementById('graphViewBtn').addEventListener('click', () => switchView('graph'));
        document.getElementById('listViewBtn').addEventListener('click', () => switchView('list'));
        
        async function loadPatterns() {
            try {
                const response = await fetch('/api/atlas/patterns');
                const data = await response.json();
                
                patterns = data.patterns || [];
                displayPatterns(patterns);
                
                document.getElementById('atlasStatusDot').classList.add('ready');
            } catch (error) {
                console.error('Error loading patterns:', error);
                document.getElementById('patternGrid').innerHTML = '<div class="atlas-empty">Error loading pattern atlas</div>';
            }
        }
        
        function displayPatterns(patterns) {
            const grid = document.getElementById('patternGrid');
            
            if (patterns.length === 0) {
                grid.innerHTML = '<div class="atlas-empty">No patterns yet. Patterns will appear as they are discovered.</div>';
                return;
            }
            
            grid.innerHTML = patterns.map(pattern => `
                <div class="pattern-card">
                    <div class="pattern-card-title">${escapeHtml(pattern.name || pattern.title || 'Pattern')}</div>
                    <div class="pattern-card-description">${escapeHtml(pattern.description || '')}</div>
                    <div class="pattern-card-meta">
                        <span>${new Date(pattern.timestamp || Date.now()).toLocaleDateString()}</span>
                        ${pattern.connections ? `<span class="connection-count">${pattern.connections.length} connections</span>` : ''}
                    </div>
                    ${pattern.connections && pattern.connections.length > 0 ? `
                        <div class="pattern-card-connections">
                            <div class="connection-count">Connected to: ${pattern.connections.slice(0, 3).map(c => escapeHtml(c)).join(', ')}${pattern.connections.length > 3 ? '...' : ''}</div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Load on page load
        loadPatterns();
        
        // Refresh every 60 seconds
        setInterval(loadPatterns, 60000);
    </script>
    <script src="state.js"></script>
    <script src="components.js"></script>
    <script src="router.js"></script>
    <script src="nav.js"></script>
    <script>
        let currentView = 'list'; // 'list' or 'graph'
        
        // Load patterns
        async function loadPatterns() {
            const container = document.getElementById('patternsList');
            if (!container) return;
            
            // Show loading
            container.innerHTML = '';
            container.appendChild(Components.createLoadingIndicator('Loading pattern atlas...'));
            
            try {
                // Check cache
                const cached = window.State?.getCachedData('atlas');
                if (cached) {
                    displayPatterns(cached.patterns || []);
                    return;
                }
                
                // Fetch from API
                const response = await fetch('/api/atlas/patterns');
                if (!response.ok) throw new Error('Failed to load patterns');
                
                const data = await response.json();
                
                // Cache
                if (window.State) {
                    window.State.cacheData('atlas', data, 600000); // 10 minutes
                }
                
                // Display
                displayPatterns(data.patterns || []);
            } catch (error) {
                console.error('Error loading patterns:', error);
                container.innerHTML = '';
                container.appendChild(Components.createErrorState('Failed to load pattern atlas', loadPatterns));
            }
        }
        
        function displayPatterns(patterns) {
            const container = document.getElementById('patternsList');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (patterns.length === 0) {
                container.appendChild(Components.createEmptyState('No patterns detected. Patterns will emerge as intelligence is processed.'));
                return;
            }
            
            patterns.forEach(pattern => {
                const card = Components.createPatternCard(pattern);
                container.appendChild(card);
            });
        }
        
        function switchView(view) {
            currentView = view;
            const listView = document.getElementById('patternsList');
            const graphView = document.getElementById('patternsGraph');
            
            if (view === 'list') {
                if (listView) listView.style.display = 'block';
                if (graphView) graphView.style.display = 'none';
                document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === 'list');
                });
            } else {
                if (listView) listView.style.display = 'none';
                if (graphView) graphView.style.display = 'block';
                document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === 'graph');
                });
                loadGraphView();
            }
        }
        
        async function loadGraphView() {
            // TODO: Implement graph visualization with D3.js or similar
            console.log('Graph view not yet implemented');
        }
        
        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadPatterns();
            
            // Setup view toggle
            document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchView(btn.dataset.view);
                });
            });
        });
    </script>
</body>
</html>
